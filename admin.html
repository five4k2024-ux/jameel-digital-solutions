<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>لوحة الإدارة | جميل علي</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="admin.css">
</head>
<body class="admin-body">
<main class="admin-shell container">
  <section id="loginView" class="admin-login">
    <div class="admin-panel">
      <span class="brand-mark">JA</span>
      <h1>دخول المدير</h1>
      <p>لوحة التحكم مخصصة للمدير فقط. سجّل الدخول بالبريد وكلمة المرور.</p>

      <form id="loginForm">
        <label>بريد المدير
          <input id="adminEmail" type="email" value="alk_1379@hotmail.com" readonly autocomplete="username">
        </label>
        <label>كلمة المرور
          <input id="adminPassword" type="password" required minlength="8" autocomplete="current-password" placeholder="أدخل كلمة المرور">
        </label>
        <button class="btn full" type="submit">تسجيل الدخول</button>
        <button class="btn btn-ghost full" id="forgotPasswordBtn" type="button">نسيت كلمة المرور</button>
        <small id="loginStatus"></small>
      </form>

      <form id="recoveryForm" hidden>
        <h2>تعيين كلمة مرور جديدة</h2>
        <p>اكتب كلمة مرور قوية جديدة للحساب الإداري.</p>
        <label>كلمة المرور الجديدة
          <input id="newPassword" type="password" required minlength="12" autocomplete="new-password">
        </label>
        <label>تأكيد كلمة المرور
          <input id="confirmPassword" type="password" required minlength="12" autocomplete="new-password">
        </label>
        <button class="btn full" type="submit">حفظ كلمة المرور الجديدة</button>
        <small id="recoveryStatus"></small>
      </form>

      <a href="index.html">← العودة للموقع</a>
    </div>
  </section>

  <section id="dashboard" hidden>
    <div class="admin-top">
      <div><span class="eyebrow">إدارة المحتوى</span><h1>المشاريع والطلبات</h1></div>
      <div><a class="btn btn-ghost" href="index.html" target="_blank">عرض الموقع</a> <button class="btn" id="logoutBtn">تسجيل الخروج</button></div>
    </div>

    <div class="admin-tabs">
      <button class="filter-btn active" data-tab="projects">المشاريع</button>
      <button class="filter-btn" data-tab="requests">طلبات العملاء</button>
    </div>

    <section id="projectsTab">
      <form id="projectForm" class="admin-panel admin-form">
        <input id="projectId" type="hidden">
        <h2 id="formTitle">إضافة مشروع</h2>
        <div class="form-grid">
          <label>اسم المشروع<input id="pTitle" required></label>
          <label>التصنيف<input id="pCategory" required placeholder="أنظمة أعمال"></label>
          <label class="wide">وصف مختصر<textarea id="pShort" required rows="2"></textarea></label>
          <label class="wide">تفاصيل المشروع<textarea id="pLong" rows="4"></textarea></label>
          <label>التقنيات<input id="pTags" placeholder="VB.NET, SQL Server, HR"></label>
          <label>ترتيب العرض<input id="pOrder" type="number" value="100"></label>
          <label>صورة المشروع<input id="pImage" type="file" accept="image/*"></label>
          <label>فيديو المشروع<input id="pVideo" type="file" accept="video/mp4,video/webm"></label>
          <label class="check"><input id="pPublished" type="checkbox" checked> ظاهر للزوار</label>
        </div>
        <div class="admin-actions">
          <button class="btn" type="submit">حفظ المشروع</button>
          <button class="btn btn-ghost" type="button" id="cancelEdit">إلغاء التعديل</button>
          <small id="projectStatus"></small>
        </div>
      </form>
      <div id="adminProjects" class="admin-list"></div>
    </section>

    <section id="requestsTab" hidden>
      <div id="requestsList" class="admin-list"></div>
    </section>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script>
<script src="supabase-config.js"></script>
<script src="admin.js"></script>
</body>
</html>
